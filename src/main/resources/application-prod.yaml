spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    org.hibernate.SQL: warn
    org.springframework.security: warn

management:
  endpoint:
    health:
      show-details: never

security:
  jwt:
    secret: ${JWT_SECRET}
